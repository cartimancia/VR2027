# Keeps the free-tier Supabase project from pausing (it pauses after ~7 days
# without database activity). Every 3 days it calls the guest_login function
# with a code that doesn't exist: a real database query, no data touched.
#
# If the project is already paused or misconfigured, the run fails and GitHub
# emails the repo owner. Run it by hand from the Actions tab ("Run workflow").

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"   # every 3 days at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: supabase-config.js
          sparse-checkout-cone-mode: false

      - name: Ping database
        run: |
          url=$(grep -oP 'url:\s*"\K[^"]*' supabase-config.js || true)
          key=$(grep -oP 'anonKey:\s*"\K[^"]*' supabase-config.js || true)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::warning::supabase-config.js is not filled in yet, nothing to ping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 30 -X POST "$url/rest/v1/rpc/guest_login" \
            -H "apikey: $key" -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE","p_name":"keepalive"}'
          echo
          echo "Database answered."
