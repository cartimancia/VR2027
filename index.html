<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vera &amp; Ricardo · 2027</title>
<meta name="description" content="Vera e Ricardo vão casar.">
<meta name="theme-color" content="#2B2A21">
<meta property="og:title" content="Vera &amp; Ricardo vão casar">
<meta property="og:description" content="Contamos os dias.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://veraricardo.pt/">
<meta property="og:image" content="https://veraricardo.pt/media/hero.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233B4530'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='30' fill='%23FBF6EA'%3EV%26R%3C/text%3E%3C/svg%3E">
<link rel="preload" as="image" href="media/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --tile:#FBF6EA;
  --wheat:#EAD7A4;
  --ink:#2B2A21;
  --display:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ink);color:var(--tile);font-family:var(--sans);-webkit-font-smoothing:antialiased}
:focus-visible{outline:1px solid var(--wheat);outline-offset:4px}

.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;text-align:center;background:#5B4A2E url("media/hero.jpg") center/cover no-repeat}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(43,42,33,.38) 0%,rgba(43,42,33,.10) 38%,rgba(43,42,33,.10) 60%,rgba(43,42,33,.62) 100%)}

.top{position:relative;z-index:1;padding:clamp(3.5rem,14vh,8rem) 1.25rem 0}
.eyebrow{margin:0;font-size:.72rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--wheat)}
.names{margin:1rem 0 0;font-family:var(--display);font-weight:400;font-size:clamp(3.4rem,10vw,8rem);line-height:.95;letter-spacing:-.02em;text-shadow:0 2px 30px rgba(0,0,0,.25)}
.names .amp{font-style:italic;color:var(--wheat);padding:0 .12em}

.bottom{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:clamp(1.75rem,4.5vh,2.75rem);padding:0 1rem calc(clamp(2rem,6vh,3.5rem) + env(safe-area-inset-bottom))}
.countdown{display:flex;justify-content:center;gap:.75rem}
.countdown div{width:5.5rem;padding:.9rem .25rem;border:1px solid rgba(251,246,234,.4);border-radius:12px;background:rgba(43,42,33,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.countdown b{display:block;font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.countdown span{display:block;margin-top:.35rem;font-size:.65rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--wheat)}

.login{position:relative;display:inline-block;padding:.5rem .1rem;color:var(--tile);text-decoration:none;font-size:.72rem;font-weight:500;letter-spacing:.3em;text-transform:uppercase;opacity:.8;transition:opacity .5s var(--ease),letter-spacing .6s var(--ease)}
.login::after{content:"";position:absolute;left:50%;right:50%;bottom:.2rem;height:1px;background:var(--wheat);transition:left .6s var(--ease),right .6s var(--ease)}
.login:hover,.login:focus-visible{opacity:1;letter-spacing:.36em}
.login:hover::after,.login:focus-visible::after{left:0;right:0}

.vid-toggle{position:absolute;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom));z-index:2;width:2.25rem;height:2.25rem;border-radius:50%;border:1px solid rgba(251,246,234,.4);background:rgba(43,42,33,.3);color:var(--tile);display:grid;place-items:center;cursor:pointer;opacity:.7;transition:opacity .3s}
.vid-toggle:hover{opacity:1}
.vid-toggle svg{width:.8rem;height:.8rem}

/* Smooth entrance */
.fade{opacity:0;transform:translateY(12px);animation:rise 1.6s var(--ease) forwards}
.d1{animation-delay:.2s}.d2{animation-delay:.55s}.d3{animation-delay:1.1s}.d4{animation-delay:1.8s}
@keyframes rise{to{opacity:1;transform:none}}

/* "Ainda não está aberto" overlay */
.soon{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:1.5rem;border:0;color:var(--tile);background:rgba(43,42,33,.5);backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1)}
.soon[open]{display:grid;place-items:center;animation:veil .7s var(--ease)}
.soon::backdrop{background:transparent}
.soon.closing{animation:unveil .45s var(--ease) forwards}
.soon .msg{text-align:center;max-width:26rem;animation:rise 1s var(--ease) .15s both}
.soon .msg .eyebrow{margin-bottom:1rem}
.soon h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,8vw,3.6rem);line-height:1.05}
.soon p.sub{margin:1rem 0 0;font-family:var(--display);font-style:italic;font-size:clamp(1.1rem,3.5vw,1.35rem);color:#E6DDC6}
.close{position:fixed;top:calc(1.25rem + env(safe-area-inset-top));right:1.25rem;width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid rgba(251,246,234,.45);background:rgba(43,42,33,.25);color:var(--tile);display:grid;place-items:center;cursor:pointer;transition:background .4s var(--ease),transform .5s var(--ease)}
.close:hover{background:rgba(251,246,234,.15);transform:rotate(90deg)}
.close svg{width:1rem;height:1rem}
@keyframes veil{from{opacity:0}to{opacity:1}}
@keyframes unveil{to{opacity:0}}

@media (max-width:600px){.countdown{gap:.5rem}.countdown div{width:4.4rem}.countdown b{font-size:1.9rem}}
@media (prefers-reduced-motion:reduce){.fade,.soon[open],.soon .msg,.soon.closing{animation:none;opacity:1;transform:none}.login,.login::after,.close{transition:none}}
</style>
</head>
<body>

<main class="hero">
  <video id="hero-video" autoplay muted loop playsinline preload="auto" poster="media/hero.jpg" aria-hidden="true">
    <source src="media/hero.mp4" type="video/mp4">
  </video>

  <div class="top">
    <p class="eyebrow fade d1">Vamos casar</p>
    <h1 class="names fade d2">Vera <span class="amp">&amp;</span> Ricardo</h1>
  </div>

  <div class="bottom">
    <div class="countdown fade d3" id="countdown" hidden aria-label="Contagem decrescente para o casamento">
      <div><b data-cd="d">0</b><span>dias</span></div>
      <div><b data-cd="h">0</b><span>horas</span></div>
      <div><b data-cd="m">0</b><span>min</span></div>
      <div><b data-cd="s">0</b><span>seg</span></div>
    </div>
    <a class="login fade d4" id="login" href="entrar.html">Entrar</a>
  </div>

  <button class="vid-toggle" id="vid-toggle" type="button" aria-label="Pausar vídeo" hidden></button>
</main>

<dialog class="soon" id="soon" aria-labelledby="soon-title">
  <button class="close" type="button" id="soon-close" aria-label="Fechar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="msg">
    <p class="eyebrow">Convidados</p>
    <h2 id="soon-title">Ainda não está aberto</h2>
    <p class="sub">A área dos convidados abre em breve.</p>
  </div>
</dialog>

<script>
/* Guest area: false = "Entrar" shows "Ainda não está aberto"; true = goes to entrar.html */
const RSVP_OPEN = false;

const soon = document.getElementById('soon');
document.getElementById('login').addEventListener('click', e => {
  if (RSVP_OPEN || !soon.showModal) return;
  e.preventDefault();
  soon.classList.remove('closing');
  soon.showModal();
});
const closeSoon = () => {
  if (!soon.open || soon.classList.contains('closing')) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { soon.close(); return; }
  soon.classList.add('closing');
  const done = e => {
    if (e.target !== soon) return;   // ignore the text's own animation bubbling up
    soon.removeEventListener('animationend', done);
    soon.close(); soon.classList.remove('closing');
  };
  soon.addEventListener('animationend', done);
};
document.getElementById('soon-close').addEventListener('click', closeSoon);
soon.addEventListener('click', e => { if (e.target === soon) closeSoon(); });           // click outside the text
soon.addEventListener('cancel', e => { e.preventDefault(); closeSoon(); });             // Esc key

/* Old-style invite links (/?c=CODE) go straight to sign-in */
const inviteCode = new URLSearchParams(location.search).get("c");
if (inviteCode) location.replace("entrar.html?c=" + encodeURIComponent(inviteCode));

/* Data e hora do casamento (hora de Portugal, verão = +01:00) */
const WEDDING = new Date("2027-05-01T12:00:00+01:00");

/* Countdown */
const cd = document.getElementById('countdown');
const el = k => cd.querySelector(`[data-cd="${k}"]`);
const tick = () => {
  const s = Math.max(0, Math.floor((WEDDING - Date.now()) / 1000));
  el('d').textContent = Math.floor(s / 86400);
  el('h').textContent = Math.floor(s % 86400 / 3600);
  el('m').textContent = Math.floor(s % 3600 / 60);
  el('s').textContent = s % 60;
};
if (WEDDING > Date.now()) { cd.hidden = false; tick(); setInterval(tick, 1000); }

/* Video: pause control; fall back to the poster image if it can't play */
const vid = document.getElementById('hero-video');
const vt = document.getElementById('vid-toggle');
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>';
const setVt = () => { vt.innerHTML = vid.paused ? ICON_PLAY : ICON_PAUSE; vt.setAttribute('aria-label', vid.paused ? 'Reproduzir vídeo' : 'Pausar vídeo'); };
vid.querySelector('source').addEventListener('error', () => vid.remove());
vid.addEventListener('error', () => vid.remove());
vid.addEventListener('loadeddata', () => { vt.hidden = false; setVt(); });
vid.addEventListener('play', setVt); vid.addEventListener('pause', setVt);
vt.addEventListener('click', () => vid.paused ? vid.play() : vid.pause());
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { vid.removeAttribute('autoplay'); vid.pause(); }
</script>
</body>
</html>
